[tox]
downloadcache = {toxworkdir}/_download/

envlist =
    {py38}-{django4.2},
    {py39}-{django4.2},
    {py310}-{django4.2},
    {py311}-{django4.2},
    {py312}-{django4.2},
    {py310}-{django5.1},
    {py311}-{django5.1},
    {py312}-{django5.1}

[testenv]
package = wheel
wheel_build_env = .pkg
basepython =
    py38: python3.8
    py39: python3.9
    py310: python3.10
    py311: python3.11
    py312: python3.12

allowlist_externals = npm, lessc

commands =
    npm install less@1.4.0
    python --version
    pip freeze
    {envpython} run_tests.py {posargs}
    flake8 ./timepiece --exclude migrations

# Other install requirements are handled by setup.py.
deps =
    django5.1: Django>=5.1.0,<5.2.0
    django4.2: Django>=4.2.0,<4.3.0
    -rrequirements/tests.txt
